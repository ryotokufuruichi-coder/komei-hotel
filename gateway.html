<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光明荘 Komei Hotel</title>
<link rel="stylesheet" href="css/tailwind.min.css">
<style>
  .lang-en,.lang-zh,.lang-ko { display: none; }
  html[lang="en"] .lang-ja { display: none; }
  html[lang="en"] .lang-en { display: inline; }
  html[lang="zh"] .lang-ja, html[lang="zh"] .lang-en { display: none; }
  html[lang="zh"] .lang-zh { display: inline; }
  html[lang="ko"] .lang-ja, html[lang="ko"] .lang-en { display: none; }
  html[lang="ko"] .lang-ko { display: inline; }

  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
    background: #f8fafc;
    color: #1e293b;
  }
  .gateway-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 280px; height: 220px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    text-decoration: none; color: inherit;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }
  .gateway-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .gateway-card .icon-circle {
    width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px; font-size: 28px;
  }
  .card-guest .icon-circle { background: #fef3c7; }
  .card-partner .icon-circle { background: #dbeafe; }
  .gateway-card h2 { font-size: 17px; font-weight: 700; margin: 0 0 6px; }
  .gateway-card p { font-size: 13px; color: #64748b; margin: 0; text-align: center; padding: 0 16px; }

  @media (max-width: 640px) {
    .card-row { flex-direction: column !important; gap: 20px !important; }
    .gateway-card { width: 260px; height: 200px; }
  }
</style>
</head>
<body>

<!-- Language Selector -->
<div style="position:fixed;top:20px;right:24px;">
  <select onchange="setLang(this.value)" id="langSel"
    style="font-size:13px;padding:6px 12px;border:1px solid #cbd5e1;border-radius:20px;background:#fff;cursor:pointer;">
    <option value="ja" selected>日本語</option>
    <option value="en">EN</option>
    <option value="zh">中文</option>
    <option value="ko">한국어</option>
  </select>
</div>

<!-- Logo -->
<div style="text-align:center;margin-bottom:40px;">
  <div style="display:inline-flex;align-items:center;gap:10px;">
    <div style="width:44px;height:44px;background:#f59e0b;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;">K</div>
    <div style="text-align:left;">
      <div style="font-size:20px;font-weight:700;color:#1e293b;">Komei Hotel</div>
      <div style="font-size:12px;color:#64748b;">光明荘</div>
    </div>
  </div>
</div>

<!-- Selection -->
<div class="card-row" style="display:flex;gap:32px;align-items:stretch;">

  <!-- Guest Card -->
  <a href="index.html" class="gateway-card card-guest">
    <div class="icon-circle">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <h2>
      <span class="lang-ja">宿泊をご検討の方</span>
      <span class="lang-en">For Guests</span>
      <span class="lang-zh">住宿预订</span>
      <span class="lang-ko">숙박 예약</span>
    </h2>
    <p>
      <span class="lang-ja">ご予約・施設案内はこちら</span>
      <span class="lang-en">Reservations & property info</span>
      <span class="lang-zh">预订及设施介绍</span>
      <span class="lang-ko">예약 및 시설 안내</span>
    </p>
  </a>

  <!-- Partner Card -->
  <a href="partner.html" class="gateway-card card-partner">
    <div class="icon-circle">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </div>
    <h2>
      <span class="lang-ja">協賛・パートナーの方</span>
      <span class="lang-en">For Partners</span>
      <span class="lang-zh">合作伙伴</span>
      <span class="lang-ko">파트너십</span>
    </h2>
    <p>
      <span class="lang-ja">協賛・運営代行のご案内</span>
      <span class="lang-en">Sponsorship & management</span>
      <span class="lang-zh">赞助及运营合作</span>
      <span class="lang-ko">협찬 및 운영 대행 안내</span>
    </p>
  </a>

</div>

<script>
function setLang(lang) {
  document.documentElement.lang = lang;
  document.getElementById('langSel').value = lang;
}
// Auto-detect browser language
(function() {
  var navLang = (navigator.language || '').toLowerCase();
  if (navLang.startsWith('en')) setLang('en');
  else if (navLang.startsWith('zh')) setLang('zh');
  else if (navLang.startsWith('ko')) setLang('ko');
})();
</script>
</body>
</html>
