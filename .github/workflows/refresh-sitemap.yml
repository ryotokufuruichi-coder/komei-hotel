name: Refresh sitemap lastmod

# Monthly "freshness ping" — bumps every <lastmod> in sitemap.xml to the
# current date so Google sees the sitemap as actively maintained. Works
# together with .github/workflows/update-reviews.yml (daily review sync)
# to keep the site looking alive even on quiet months.

on:
  schedule:
    # 03:30 JST on the 1st of every month (18:30 UTC on the previous day)
    - cron: "30 18 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-sitemap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump every sitemap <lastmod> to today's date
        run: python scripts/refresh_sitemap.py

      - name: Commit + push if changed
        run: |
          if [[ -z "$(git status --porcelain sitemap.xml)" ]]; then
            echo "No sitemap.xml changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "auto: monthly sitemap lastmod refresh

          Bumped by .github/workflows/refresh-sitemap.yml"
          git push
